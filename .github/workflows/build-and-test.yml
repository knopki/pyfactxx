name: Build and test pyfactxx

on:
  workflow_dispatch:
  push:
    branches: [$default-branch, "wheels"]
  pull_request:
    branches: [$default-branch, "wheels"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FaCT++.Python
    strategy:
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10"]

    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@460a772e4cf7358f9f2f23773240813e40e7a894 # 2024-03-31
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-build cmake cython pytest pytest-cov
      - name: Install package
        run: |
          pip install .
      - name: Test with pytest
        run: |
          pytest
